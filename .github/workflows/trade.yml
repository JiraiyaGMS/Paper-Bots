# Put this file at .github/workflows/trade.yml in your repo
name: paper-trade

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the top of the hour
  workflow_dispatch:                # lets you run it manually / from cron-job.org

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          START_EQUITY: "100"
